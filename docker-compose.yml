version: '3.8'

services:

  # ── SQL Server Database ──────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    # Healthcheck: wait until SQL Server is accepting connections
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
        -No -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Admin Service ────────────────────────────────────────────────────────────
  admin-app:
    build:
      # Context is the repo root so the Dockerfile can access all Maven modules
      context: .
      dockerfile: admin/Dockerfile
    container_name: course-admin-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ── Public Service ───────────────────────────────────────────────────────────
  public-app:
    build:
      context: .
      dockerfile: public/Dockerfile
    container_name: course-public-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
